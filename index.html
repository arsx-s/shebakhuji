<!DOCTYPE html>

<head>
  <meta charset="utf-8" />

  <title>সেবাসাথী — বিশ্বস্ত সেবা, আপনার দরজায়</title>
  <meta name="description" content="সেবাসাথী — বাংলাদেশের বিশ্বস্ত সেবা মার্কেটপ্লেস। ঘরের কাজ, মেরামত, পরিষ্কার ও পেশাদার সেবা — যাচাই করা পেশাদারদের কাছ থেকে, সহজ কোটেশন ও নিরাপদ পেমেন্টসহ।" />
  <meta name="theme-color" content="#F6F6F7" />
  <meta name="color-scheme" content="light dark" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./assets/brand/icon.svg" />
  <link rel="apple-touch-icon" href="./assets/brand/icon-192.png" />
  <link rel="apple-mobile-web-app-capable" content="yes" />
  <link rel="apple-mobile-web-app-title" content="সেবাসাথী" />
  <script>
    /* Runs before the stylesheet is applied, so a reload never flashes the
       wrong appearance. Tiny on purpose: src/theme.js is the single source of
       truth afterwards and reads and writes exactly the same two keys. */
    (function () {
      try {
        var root = document.documentElement;
        var theme = null;
        var motion = null;
        try { theme = localStorage.getItem('shebashathi.theme'); } catch (e) { theme = null; }
        try { motion = localStorage.getItem('shebashathi.motion'); } catch (e) { motion = null; }
        if (theme !== 'light' && theme !== 'dark' && theme !== 'system') theme = 'dark';
        if (motion !== 'reduced' && motion !== 'full' && motion !== 'system') motion = 'system';
        root.setAttribute('data-theme', theme);
        var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        root.style.colorScheme = dark ? 'dark' : 'light';
        root.setAttribute('data-motion', motion === 'reduced' || (motion === 'system' && window.matchMedia('(prefers-reduced-motion: reduce)').matches) ? 'reduced' : 'full');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#0B0B0D' : '#F6F6F7');
      } catch (e) { /* without storage the app simply renders in the default appearance */ }
    })();
  </script>
  <link rel="stylesheet" href="./assets/styles/app.css" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="সেবাসাথী — বিশ্বস্ত সেবা, আপনার দরজায়" />
  <meta property="og:description" content="যাচাই করা পেশাদারদের কাছ থেকে ঘরের কাজ, মেরামত ও পেশাদার সেবা — সহজ কোটেশন, নিরাপদ পেমেন্ট।" />
  <meta property="og:image" content="./assets/illustrations/hero-services.svg" />
  <meta property="og:locale" content="bn_BD" />
  <meta property="og:locale:alternate" content="en_BD" />
</head>
